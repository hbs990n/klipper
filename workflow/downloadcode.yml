name: Fetch Klipper source

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'   # 每周日自动更新

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sparse clone klipper from TDE
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://mirror.git.trinitydesktop.org/gitea/TDE/tdebase /tmp/tdebase
          cd /tmp/tdebase
          git sparse-checkout set klipper
          echo "Fetched commit: $(git rev-parse --short HEAD)"

      - name: Copy klipper sources into repo
        run: |
          rm -rf klipper
          cp -r /tmp/tdebase/klipper klipper
          git status --short | head -20

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add klipper
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "Update klipper source from TDE tdebase master"
            git push
          fi
